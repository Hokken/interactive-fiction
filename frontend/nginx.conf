server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Proxy API requests if you wanted to serve everything on one port
    # location /api/ {
    #     proxy_pass http://backend:3001;
    # }
}
